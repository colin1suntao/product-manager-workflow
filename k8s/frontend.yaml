apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: pm-workstation
  labels:
    app: pm-workstation
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pm-workstation
      component: frontend
  template:
    metadata:
      labels:
        app: pm-workstation
        component: frontend
    spec:
      containers:
        - name: frontend
          image: pm-workstation-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://backend-service:8000"
            - name: NODE_ENV
              value: production
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: pm-workstation
  labels:
    app: pm-workstation
    component: frontend
spec:
  selector:
    app: pm-workstation
    component: frontend
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pm-workstation-ingress
  namespace: pm-workstation
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  rules:
    - host: pm-workstation.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8000
