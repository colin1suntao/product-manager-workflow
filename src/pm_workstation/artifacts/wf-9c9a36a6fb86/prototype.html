<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>创建一个电商平台的用户管理系统，包括注册、登录、权限管理功能</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; background: #f5f5f5; }
        .container { background: white; border-radius: 12px; padding: 32px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { color: #1a1a1a; margin-bottom: 24px; }
        .section { margin-bottom: 24px; padding: 16px; background: #f8f9fa; border-radius: 8px; }
        .section h2 { color: #4a5568; font-size: 18px; margin-bottom: 12px; }
        .section p { color: #666; line-height: 1.6; }
        .tag { display: inline-block; padding: 4px 12px; background: #e2e8f0; border-radius: 16px; font-size: 14px; margin: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>创建一个电商平台的用户管理系统，包括注册、登录、权限管理功能</h1>
        <div class="section">
            <h2>需求描述</h2>
            <p>创建一个电商平台的用户管理系统，包括注册、登录、权限管理功能</p>
        </div>
        <div class="section">
            <h2>功能模块</h2>
            <p>根据需求分析，系统包含以下核心功能模块：</p>
            <span class="tag">用户管理</span>
            <span class="tag">业务处理</span>
            <span class="tag">数据分析</span>
        </div>
        <div class="section">
            <h2>页面结构</h2>
            <p>首页 → 功能列表 → 详情页面 → 操作面板</p>
        </div>
    </div>
</body>
</html>
