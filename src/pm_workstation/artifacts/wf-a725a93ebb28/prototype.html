<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>待办事项管理应用</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #e0e7ff;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-800: #1f2937;
            --gray-900: #111827;
            --radius: 8px;
            --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--gray-50);
            color: var(--gray-800);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* 导航栏 */
        .navbar {
            background-color: white;
            box-shadow: var(--shadow);
            padding: 16px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo svg {
            width: 28px;
            height: 28px;
        }

        .nav-links {
            display: flex;
            gap: 24px;
        }

        .nav-link {
            text-decoration: none;
            color: var(--gray-600);
            font-weight: 500;
            padding: 8px 12px;
            border-radius: var(--radius);
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--primary);
            background-color: var(--primary-light);
        }

        /* 主要内容 */
        .main-content {
            padding: 32px 0;
        }

        .page-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 32px;
            color: var(--gray-900);
        }

        /* 统计卡片 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 24px;
            margin-bottom: 32px;
        }

        .stat-card {
            background-color: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .stat-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .stat-card-title {
            font-size: 14px;
            font-weight: 500;
            color: var(--gray-500);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .stat-card-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stat-card-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--gray-900);
            margin-bottom: 4px;
        }

        .stat-card-description {
            font-size: 14px;
            color: var(--gray-500);
        }

        .icon-blue {
            background-color: var(--primary-light);
            color: var(--primary);
        }

        .icon-green {
            background-color: #ecfdf5;
            color: var(--success);
        }

        .icon-yellow {
            background-color: #fffbeb;
            color: var(--warning);
        }

        .icon-red {
            background-color: #fef2f2;
            color: var(--danger);
        }

        /* 待办事项区域 */
        .todo-section {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 32px;
        }

        @media (max-width: 768px) {
            .todo-section {
                grid-template-columns: 1fr;
            }
        }

        /* 添加待办事项表单 */
        .add-todo-card {
            background-color: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px;
            height: fit-content;
            position: sticky;
            top: 100px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 24px;
            color: var(--gray-800);
            padding-bottom: 12px;
            border-bottom: 1px solid var(--gray-200);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--gray-700);
            margin-bottom: 6px;
        }

        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--gray-300);
            border-radius: var(--radius);
            font-size: 14px;
            color: var(--gray-800);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            background-color: white;
        }

        .form-input:focus, .form-select:focus, .form-textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .form-textarea {
            resize: vertical;
            min-height: 80px;
        }

        .priority-options {
            display: flex;
            gap: 12px;
        }

        .priority-option {
            flex: 1;
            position: relative;
        }

        .priority-option input {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .priority-option label {
            display: block;
            padding: 10px;
            text-align: center;
            border: 1px solid var(--gray-300);
            border-radius: var(--radius);
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
        }

        .priority-option input:checked + label {
            border-color: var(--primary);
            background-color: var(--primary-light);
            color: var(--primary);
            font-weight: 500;
        }

        .priority-option label:hover {
            border-color: var(--gray-400);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 16px;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            width: 100%;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: #4338ca;
        }

        .btn-primary:active {
            background-color: #3730a3;
            transform: translateY(1px);
        }

        .btn-secondary {
            background-color: white;
            color: var(--gray-700);
            border: 1px solid var(--gray-300);
        }

        .btn-secondary:hover {
            background-color: var(--gray-50);
        }

        .btn-secondary:active {
            background-color: var(--gray-100);
        }

        .btn-danger {
            background-color: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background-color: #dc2626;
        }

        .btn-danger:active {
            background-color: #b91c1c;
        }

        /* 待办事项列表 */
        .todo-list-card {
            background-color: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px;
        }

        .todo-list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .filter-tabs {
            display: flex;
            gap: 8px;
        }

        .filter-tab {
            padding: 8px 16px;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            background: none;
            color: var(--gray-600);
        }

        .filter-tab:hover {
            background-color: var(--gray-100);
        }

        .filter-tab.active {
            background-color: var(--primary);
            color: white;
        }

        .search-box {
            position: relative;
            width: 250px;
        }

        .search-box input {
            width: 100%;
            padding: 8px 12px 8px 36px;
            border: 1px solid var(--gray-300);
            border-radius: var(--radius);
            font-size: 14px;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-400);
        }

        .todo-list {
            list-style: none;
        }

        .todo-item {
            display: flex;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid var(--gray-200);
            transition: background-color 0.2s ease;
        }

        .todo-item:last-child {
            border-bottom: none;
        }

        .todo-item:hover {
            background-color: var(--gray-50);
            margin: 0 -24px;
            padding: 16px 24px;
        }

        .todo-checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid var(--gray-300);
            border-radius: 4px;
            margin-right: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .todo-checkbox.checked {
            background-color: var(--success);
            border-color: var(--success);
        }

        .todo-checkbox.checked::after {
            content: "✓";
            color: white;
            font-size: 12px;
            font-weight: bold;
        }

        .todo-content {
            flex: 1;
            min-width: 0;
        }

        .todo-title {
            font-size: 16px;
            font-weight: 500;
            color: var(--gray-800);
            margin-bottom: 4px;
            word-break: break-word;
        }

        .todo-title.completed {
            text-decoration: line-through;
            color: var(--gray-400);
        }

        .todo-description {
            font-size: 14px;
            color: var(--gray-500);
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .todo-meta {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .todo-tag {
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        .tag-high {
            background-color: #fef2f2;
            color: var(--danger);
        }

        .tag-medium {
            background-color: #fffbeb;
            color: var(--warning);
        }

        .tag-low {
            background-color: #ecfdf5;
            color: var(--success);
        }

        .todo-date {
            font-size: 12px;
            color: var(--gray-400);
        }

        .todo-actions {
            display: flex;
            gap: 8px;
            margin-left: 16px;
        }

        .action-btn {
            width: 32px;
            height: 32px;
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            background: none;
            color: var(--gray-400);
        }

        .action-btn:hover {
            background-color: var(--gray-100);
            color: var(--gray-600);
        }

        .action-btn.edit:hover {
            color: var(--primary);
            background-color: var(--primary-light);
        }

        .action-btn.delete:hover {
            color: var(--danger);
            background-color: #fef2f2;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--gray-400);
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            color: var(--gray-300);
        }

        .empty-state h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--gray-500);
        }

        .empty-state p {
            font-size: 14px;
            max-width: 400px;
            margin: 0 auto;
        }

        /* 模态框 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background-color: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal {
            transform: translateY(0);
        }

        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--gray-800);
        }

        .modal-close {
            width: 32px;
            height: 32px;
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            background: none;
            color: var(--gray-400);
        }

        .modal-close:hover {
            background-color: var(--gray-100);
            color: var(--gray-600);
        }

        .modal-body {
            padding: 24px;
        }

        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--gray-200);
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        /* 加载动画 */
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* 提示消息 */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background-color: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 1001;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast-success {
            border-left: 4px solid var(--success);
        }

        .toast-error {
            border-left: 4px solid var(--danger);
        }

        .toast-icon {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
        }

        .toast-message {
            font-size: 14px;
            color: var(--gray-700);
        }

        /* 响应式调整 */
        @media (max-width: 480px) {
            .nav-links {
                display: none;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .search-box {
                width: 100%;
            }
            
            .todo-list-header {
                flex-direction: column;
                gap: 16px;
                align-items: flex-start;
            }
            
            .filter-tabs {
                width: 100%;
                overflow-x: auto;
                padding-bottom: 8px;
            }
            
            .todo-actions {
                margin-left: 0;
                margin-top: 12px;
            }
            
            .todo-item {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
                任务清单
            </div>
            <div class="nav-links">
                <a class="nav-link active" data-page="dashboard">仪表盘</a>
                <a class="nav-link" data-page="todos">任务管理</a>
                <a class="nav-link" data-page="settings">设置</a>
            </div>
        </div>
    </nav>

    <!-- 主要内容 -->
    <main class="main-content">
        <div class="container">
            <!-- 仪表盘页面 -->
            <div id="dashboard-page" class="page active">
                <h1 class="page-title">仪表盘</h1>
                
                <!-- 统计卡片 -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-card-header">
                            <div class="stat-card-title">总任务</div>
                            <div class="stat-card-icon icon-blue">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                    <polyline points="14 2 14 8 20 8"></polyline>
                                    <line x1="16" y1="13" x2="8" y2="13"></line>
                                    <line x1="16" y1="17" x2="8" y2="17"></line>
                                    <polyline points="10 9 9 9 8 9"></polyline>
                                </svg>
                            </div>
                        </div>
                        <div class="stat-card-value" id="total-tasks">0</div>
                        <div class="stat-card-description">所有任务的数量</div>
                    </div>
                    
                    <div class="stat-card">
                        <div class="stat-card-header">
                            <div class="stat-card-title">已完成</div>
                            <div class="stat-card-icon icon-green">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                                </svg>
                            </div>
                        </div>
                        <div class="stat-card-value" id="completed-tasks">0</div>
                        <div class="stat-card-description">已完成的任务数量</div>
                    </div>
                    
                    <div class="stat-card">
                        <div class="stat-card-header">
                            <div class="stat-card-title">进行中</div>
                            <div class="stat-card-icon icon-yellow">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <polyline points="12 6 12 12 16 14"></polyline>
                                </svg>
                            </div>
                        </div>
                        <div class="stat-card-value" id="active-tasks">0</div>
                        <div class="stat-card-description">正在处理的任务</div>
                    </div>
                    
                    <div class="stat-card">
                        <div class="stat-card-header">
                            <div class="stat-card-title">高优先级</div>
                            <div class="stat-card-icon icon-red">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 2"></polygon>
                                    <line x1="12" y1="8" x2="12" y2="12"></line>
                                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                                </svg>
                            </div>
                        </div>
                        <div class="stat-card-value" id="high-priority-tasks">0</div>
                        <div class="stat-card-description">需要优先处理的任务</div>
                    </div>
                </div>
                
                <!-- 最近任务 -->
                <div class="todo-list-card">
                    <div class="todo-list-header">
                        <h2 class="card-title">最近任务</h2>
                    </div>
                    <ul class="todo-list" id="recent-todos">
                        <!-- 动态生成 -->
                    </ul>
                </div>
            </div>
            
            <!-- 任务管理页面 -->
            <div id="todos-page" class="page">
                <h1 class="page-title">任务管理</h1>
                
                <div class="todo-section">
                    <!-- 添加任务表单 -->
                    <div class="add-todo-card">
                        <h2 class="card-title">添加新任务</h2>
                        <form id="add-todo-form">
                            <div class="form-group">
                                <label class="form-label" for="todo-title">任务标题 *</label>
                                <input type="text" class="form-input" id="todo-title" placeholder="输入任务标题" required>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label" for="todo-description">任务描述</label>
                                <textarea class="form-textarea" id="todo-description" placeholder="输入任务描述"></textarea>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">优先级</label>
                                <div class="priority-options">
                                    <div class="priority-option">
                                        <input type="radio" id="priority-low" name="priority" value="low">
                                        <label for="priority-low">低</label>
                                    </div>
                                    <div class="priority-option">
                                        <input type="radio" id="priority-medium" name="priority" value="medium" checked>
                                        <label for="priority-medium">中</label>
                                    </div>
                                    <div class="priority-option">
                                        <input type="radio" id="priority-high" name="priority" value="high">
                                        <label for="priority-high">高</label>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label" for="todo-due-date">截止日期</label>
                                <input type="date" class="form-input" id="todo-due-date">
                            </div>
                            
                            <button type="submit" class="btn btn-primary" id="add-todo-btn">
                                添加任务
                            </button>
                        </form>
                    </div>
                    
                    <!-- 任务列表 -->
                    <div class="todo-list-card">
                        <div class="todo-list-header">
                            <div class="filter-tabs">
                                <button class="filter-tab active" data-filter="all">全部</button>
                                <button class="filter-tab" data-filter="active">进行中</button>
                                <button class="filter-tab" data-filter="completed">已完成</button>
                            </div>
                            <div class="search-box">
                                <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="11" cy="11" r="8"></circle>
                                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                </svg>
                                <input type="text" id="search-input" placeholder="搜索任务...">
                            </div>
                        </div>
                        
                        <ul class="todo-list" id="todo-list">
                            <!-- 动态生成 -->
                        </ul>
                        
                        <div class="empty-state" id="empty-state">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
                            </svg>
                            <h3>暂无任务</h3>
                            <p>点击左侧的"添加任务"按钮创建你的第一个任务</p>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 设置页面 -->
            <div id="settings-page" class="page">
                <h1 class="page-title">设置</h1>
                <div class="todo-list-card">
                    <h2 class="card-title">应用设置</h2>
                    <div class="form-group">
                        <label class="form-label">
                            <input type="checkbox" id="show-completed" checked> 显示已完成任务
                        </label>
                    </div>
                    <div class="form-group">
                        <label class="form-label">
                            <input type="checkbox" id="auto-save" checked> 自动保存更改
                        </label>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="theme-select">主题颜色</label>
                        <select class="form-select" id="theme-select">
                            <option value="blue">蓝色主题</option>
                            <option value="green">绿色主题</option>
                            <option value="purple">紫色主题</option>
                            <option value="red">红色主题</option>
                        </select>
                    </div>
                    <button class="btn btn-primary" id="save-settings-btn" style="width: auto; margin-top: 16px;">
                        保存设置
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- 编辑任务模态框 -->
    <div class="modal-overlay" id="edit-modal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">编辑任务</h3>
                <button class="modal-close" id="close-modal">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <form id="edit-todo-form">
                    <input type="hidden" id="edit-todo-id">
                    <div class="form-group">
                        <label class="form-label" for="edit-title">任务标题 *</label>
                        <input type="text" class="form-input" id="edit-title" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="edit-description">任务描述</label>
                        <textarea class="form-textarea" id="edit-description"></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">优先级</label>
                        <div class="priority-options">
                            <div class="priority-option">
                                <input type="radio" id="edit-priority-low" name="edit-priority" value="low">
                                <label for="edit-priority-low">低</label>
                            </div>
                            <div class="priority-option">
                                <input type="radio" id="edit-priority-medium" name="edit-priority" value="medium">
                                <label for="edit-priority-medium">中</label>
                            </div>
                            <div class="priority-option">
                                <input type="radio" id="edit-priority-high" name="edit-priority" value="high">
                                <label for="edit-priority-high">高</label>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="edit-due-date">截止日期</label>
                        <input type="date" class="form-input" id="edit-due-date">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancel-edit">取消</button>
                <button class="btn btn-primary" id="save-edit">保存更改</button>
            </div>
        </div>
    </div>

    <!-- 确认删除模态框 -->
    <div class="modal-overlay" id="delete-modal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">确认删除</h3>
                <button class="modal-close" id="close-delete-modal">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <p>确定要删除这个任务吗？此操作无法撤销。</p>
                <p id="delete-task-name" style="font-weight: 500; margin-top: 8px;"></p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancel-delete">取消</button>
                <button class="btn btn-danger" id="confirm-delete">删除</button>
            </div>
        </div>
    </div>

    <!-- 提示消息 -->
    <div class="toast toast-success" id="success-toast">
        <svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
        <span class="toast-message" id="success-message">操作成功！</span>
    </div>
    
    <div class="toast toast-error" id="error-toast">
        <svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="15" y1="9" x2="9" y2="15"></line>
            <line x1="9" y1="9" x2="15" y2="15"></line>
        </svg>
        <span class="toast-message" id="error-message">操作失败！</span>
    </div>

    <script>
        // 应用状态
        let todos = [];
        let currentFilter = 'all';
        let currentSearch = '';
        let deleteTodoId = null;
        let editTodoId = null;

        // 模拟数据
        const sampleTodos = [
            {
                id: 1,
                title: "完成季度项目报告",
                description: "整理本季度的项目进展和成果，准备向管理层汇报",
                priority: "high",
                dueDate: "2023-12-15",
                completed: false,
                createdAt: "2023-12-01T10:30:00Z"
            },
            {
                id: 2,
                title: "团队周会准备",
                description: "准备本周的团队会议议程和演示材料",
                priority: "medium",
                dueDate: "2023-12-08",
                completed: true,
                createdAt: "2023-12-02T14:20:00Z"
            },
            {
                id: 3,
                title: "代码审查",
                description: "审查前端团队提交的代码变更，确保代码质量",
                priority: "medium",
                dueDate: "2023-12-10",
                completed: false,
                createdAt: "2023-12-03T09:15:00Z"
            },
            {
                id: 4,
                title: "用户反馈分析",
                description: "分析最近收到的用户反馈，找出常见问题和改进建议",
                priority: "low",
                dueDate: "2023-12-20",
                completed: false,
                createdAt: "2023-12-04T16:45:00Z"
            },
            {
                id: 5,
                title: "更新产品文档",
                description: "更新产品使用手册和API文档，添加新功能说明",
                priority: "medium",
                dueDate: "2023-12-12",
                completed: false,
                createdAt: "2023-12-05T11:30:00Z"
            },
            {
                id: 6,
                title: "性能优化",
                description: "分析应用性能瓶颈，实施优化措施提升加载速度",
                priority: "high",
                dueDate: "2023-12-18",
                completed: false,
                createdAt: "2023-12-06T08:20:00Z"
            },
            {
                id: 7,
                title: "团队建设活动",
                description: "组织一次团队建设活动，增强团队凝聚力",
                priority: "low",
                dueDate: "2023-12-25",
                completed: false,
                createdAt: "2023-12-07T15:10:00Z"
            }
        ];

        // 初始化应用
        function initApp() {
            // 从localStorage加载数据
            const savedTodos = localStorage.getItem('todos');
            if (savedTodos) {
                todos = JSON.parse(savedTodos);
            } else {
                // 使用示例数据
                todos = sampleTodos;
                saveTodos();
            }
            
            // 设置事件监听器
            setupEventListeners();
            
            // 渲染页面
            renderTodos();
            updateStats();
            renderRecentTodos();
            
            // 设置默认日期
            document.getElementById('todo-due-date').valueAsDate = new Date();
        }

        // 保存数据到localStorage
        function saveTodos() {
            localStorage.setItem('todos', JSON.stringify(todos));
        }

        // 设置事件监听器
        function setupEventListeners() {
            // 导航链接
            document.querySelectorAll('.nav-link').forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const page = this.dataset.page;
                    showPage(page);
                });
            });
            
            // 添加任务表单
            document.getElementById('add-todo-form').addEventListener('submit', function(e) {
                e.preventDefault();
                addTodo();
            });
            
            // 筛选标签
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.dataset.filter;
                    renderTodos();
                });
            });
            
            // 搜索框
            document.getElementById('search-input').addEventListener('input', function() {
                currentSearch = this.value.toLowerCase();
                renderTodos();
            });
            
            // 编辑模态框
            document.getElementById('close-modal').addEventListener('click', closeModal);
            document.getElementById('cancel-edit').addEventListener('click', closeModal);
            document.getElementById('save-edit').addEventListener('click', saveEdit);
            
            // 删除模态框
            document.getElementById('close-delete-modal').addEventListener('click', closeDeleteModal);
            document.getElementById('cancel-delete').addEventListener('click', closeDeleteModal);
            document.getElementById('confirm-delete').addEventListener('click', confirmDelete);
            
            // 设置页面
            document.getElementById('save-settings-btn').addEventListener('click', function() {
                showToast('success', '设置已保存！');
            });
        }

        // 显示页面
        function showPage(page) {
            // 隐藏所有页面
            document.querySelectorAll('.page').forEach(p => {
                p.style.display = 'none';
            });
            
            // 显示目标页面
            document.getElementById(`${page}-page`).style.display = 'block';
            
            // 更新导航状态
            document.querySelectorAll('.nav-link').forEach(link => {
                link.classList.remove('active');
                if (link.dataset.page === page) {
                    link.classList.add('active');
                }
            });
            
            // 如果是仪表盘，更新统计
            if (page === 'dashboard') {
                updateStats();
                renderRecentTodos();
            }
        }

        // 添加任务
        function addTodo() {
            const title = document.getElementById('todo-title').value.trim();
            const description = document.getElementById('todo-description').value.trim();
            const priority = document.querySelector('input[name="priority"]:checked').value;
            const dueDate = document.getElementById('todo-due-date').value;
            
            if (!title) {
                showToast('error', '请输入任务标题！');
                return;
            }
            
            const newTodo = {
                id: Date.now(),
                title,
                description,
                priority,
                dueDate,
                completed: false,
                createdAt: new Date().toISOString()
            };
            
            todos.unshift(newTodo);
            saveTodos();
            
            // 重置表单
            document.getElementById('add-todo-form').reset();
            document.getElementById('todo-due-date').valueAsDate = new Date();
            document.getElementById('priority-medium').checked = true;
            
            // 更新UI
            renderTodos();
            updateStats();
            showToast('success', '任务添加成功！');
        }

        // 渲染任务列表
        function renderTodos() {
            const todoList = document.getElementById('todo-list');
            const emptyState = document.getElementById('empty-state');
            
            // 筛选任务
            let filteredTodos = todos.filter(todo => {
                const matchesFilter = currentFilter === 'all' || 
                    (currentFilter === 'active' && !todo.completed) || 
                    (currentFilter === 'completed' && todo.completed);
                
                const matchesSearch = currentSearch === '' || 
                    todo.title.toLowerCase().includes(currentSearch) || 
                    todo.description.toLowerCase().includes(currentSearch);
                
                return matchesFilter && matchesSearch;
            });
            
            // 按创建时间排序
            filteredTodos.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
            
            if (filteredTodos.length === 0) {
                todoList.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }
            
            emptyState.style.display = 'none';
            
            todoList.innerHTML = filteredTodos.map(todo => `
                <li class="todo-item" data-id="${todo.id}">
                    <div class="todo-checkbox ${todo.completed ? 'checked' : ''}" onclick="toggleTodo(${todo.id})"></div>
                    <div class="todo-content">
                        <div class="todo-title ${todo.completed ? 'completed' : ''}">${todo.title}</div>
                        ${todo.description ? `<div class="todo-description">${todo.description}</div>` : ''}
                        <div class="todo-meta">
                            <span class="todo-tag tag-${todo.priority}">${getPriorityText(todo.priority)}</span>
                            ${todo.dueDate ? `<span class="todo-date">截止: ${formatDate(todo.dueDate)}</span>` : ''}
                        </div>
                    </div>
                    <div class="todo-actions">
                        <button class="action-btn edit" onclick="editTodo(${todo.id})" title="编辑">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                            </svg>
                        </button>
                        <button class="action-btn delete" onclick="showDeleteModal(${todo.id})" title="删除">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="3 6 5 6 21 6"></polyline>
                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                <line x1="10" y1="11" x2="10" y2="17"></line>
                                <line x1="14" y1="11" x2="14" y2="17"></line>
                            </svg>
                        </button>
                    </div>
                </li>
            `).join('');
        }

        // 渲染最近任务（仪表盘）
        function renderRecentTodos() {
            const recentTodos = document.getElementById('recent-todos');
            
            // 获取最近5个任务
            const recent = [...todos]
                .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt))
                .slice(0, 5);
            
            if (recent.length === 0) {
                recentTodos.innerHTML = `
                    <li class="empty-state" style="padding: 40px 20px;">
                        <h3>暂无任务</h3>
                        <p>开始创建你的第一个任务吧！</p>
                    </li>
                `;
                return;
            }
            
            recentTodos.innerHTML = recent.map(todo => `
                <li class="todo-item" data-id="${todo.id}">
                    <div class="todo-checkbox ${todo.completed ? 'checked' : ''}" onclick="toggleTodo(${todo.id})"></div>
                    <div class="todo-content">
                        <div class="todo-title ${todo.completed ? 'completed' : ''}">${todo.title}</div>
                        <div class="todo-meta">
                            <span class="todo-tag tag-${todo.priority}">${getPriorityText(todo.priority)}</span>
                            ${todo.dueDate ? `<span class="todo-date">截止: ${formatDate(todo.dueDate)}</span>` : ''}
                        </div>
                    </div>
                </li>
            `).join('');
        }

        // 更新统计信息
        function updateStats() {
            const total = todos.length;
            const completed = todos.filter(todo => todo.completed).length;
            const active = total - completed;
            const highPriority = todos.filter(todo => todo.priority === 'high').length;
            
            document.getElementById('total-tasks').textContent = total;
            document.getElementById('completed-tasks').textContent = completed;
            document.getElementById('active-tasks').textContent = active;
            document.getElementById('high-priority-tasks').textContent = highPriority;
        }

        // 切换任务状态
        function toggleTodo(id) {
            const todo = todos.find(t => t.id === id);
            if (todo) {
                todo.completed = !todo.completed;
                saveTodos();
                renderTodos();
                updateStats();
                renderRecentTodos();
                
                const message = todo.completed ? '任务已完成！' : '任务已恢复为进行中！';
                showToast('success', message);
            }
        }

        // 编辑任务
        function editTodo(id) {
            const todo = todos.find(t => t.id === id);
            if (!todo) return;
            
            editTodoId = id;
            
            // 填充表单
            document.getElementById('edit-todo-id').value = id;
            document.getElementById('edit-title').value = todo.title;
            document.getElementById('edit-description').value = todo.description || '';
            document.getElementById('edit-due-date').value = todo.dueDate || '';
            
            // 设置优先级
            document.getElementById(`edit-priority-${todo.priority}`).checked = true;
            
            // 显示模态框
            document.getElementById('edit-modal').classList.add('active');
        }

        // 保存编辑
        function saveEdit() {
            const id = editTodoId;
            const title = document.getElementById('edit-title').value.trim();
            const description = document.getElementById('edit-description').value.trim();
            const priority = document.querySelector('input[name="edit-priority"]:checked').value;
            const dueDate = document.getElementById('edit-due-date').value;
            
            if (!title) {
                showToast('error', '请输入任务标题！');
                return;
            }
            
            const todoIndex = todos.findIndex(t => t.id === id);
            if (todoIndex !== -1) {
                todos[todoIndex] = {
                    ...todos[todoIndex],
                    title,
                    description,
                    priority,
                    dueDate
                };
                
                saveTodos();
                closeModal();
                renderTodos();
                showToast('success', '任务更新成功！');
            }
        }

        // 关闭编辑模态框
        function closeModal() {
            document.getElementById('edit-modal').classList.remove('active');
            editTodoId = null;
        }

        // 显示删除确认模态框
        function showDeleteModal(id) {
            deleteTodoId = id;
            const todo = todos.find(t => t.id === id);
            
            if (todo) {
                document.getElementById('delete-task-name').textContent = `"${todo.title}"`;
                document.getElementById('delete-modal').classList.add('active');
            }
        }

        // 关闭删除模态框
        function closeDeleteModal() {
            document.getElementById('delete-modal').classList.remove('active');
            deleteTodoId = null;
        }

        // 确认删除
        function confirmDelete() {
            if (deleteTodoId) {
                todos = todos.filter(t => t.id !== deleteTodoId);
                saveTodos();
                closeDeleteModal();
                renderTodos();
                updateStats();
                renderRecentTodos();
                showToast('success', '任务已删除！');
            }
        }

        // 显示提示消息
        function showToast(type, message) {
            const toast = document.getElementById(`${type}-toast`);
            const messageElement = document.getElementById(`${type}-message`);
            
            messageElement.textContent = message;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // 辅助函数
        function getPriorityText(priority) {
            const map = {
                low: '低',
                medium: '中',
                high: '高'
            };
            return map[priority] || priority;
        }

        function formatDate(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            return date.toLocaleDateString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            });
        }

        // 初始化应用
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
